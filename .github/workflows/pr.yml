name: Pull Request Checks
on:
    pull_request:
        branches: ["master"]

permissions:
    contents: read

jobs:
    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v3
            with:
                node-version: '22.x'
                cache: 'npm'

          - name: Install dependencies
            run: npm ci

          - name: Run unit tests
            run: npm run test:prod
