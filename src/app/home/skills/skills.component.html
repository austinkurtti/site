<section [id]="navigationId">
    <div akDeferLoad
        class="content"
        [threshold]="deferThreshold"
        (deferLoad)="deferLoad()"
    >
        <div class="row g-0 px-4 px-xxl-0 mb-3">
            <div class="col-12 offset-xxl-2 col-xxl-8">
                <ak-section-title [text]="title"></ak-section-title>
            </div>
        </div>
        <div #skillsCarousel
            id="skills-carousel"
            class="py-3"
            (mouseover)="mouseover()"
            (mouseout)="mouseout()"
        >
            @for (skill of skills; track skill.icon) {
                <ak-skill
                    [name]="skill.name"
                    [icon]="skill.icon"
                    [type]="skill.type"
                ></ak-skill>
            }
        </div>
    </div>
</section>
