<header class="row g-0 align-items-center position-fixed w-100">
    <div class="col text-end">
        <label class="me-3">Time</label>
        <span>{{ time }}</span>
    </div>
    <div class="col text-center">
        <label class="me-3">Score</label>
        <span>{{ score }}</span>
    </div>
    <div class="col">
        <label class="me-3">Moves</label>
        <span>{{ moves }}</span>
    </div>
</header>

<main class="row g-0 position-static h-100">
    <div id="stock-col" class="col-auto h-100">
        <div id="stock" [class.empty]="!stock.length">
        </div>
    </div>
    <div class="col d-flex justify-content-around h-100">
        @for (tableau of tableaus; track tableau) {
            <div class="tableau">
                @for (card of tableau; track card; let i = $index) {
                    <div class="solitaire-card"
                        [class.facedown]="card.facedown"
                        [style.transform]="'translateY(' + ((i * 4 * baseSizePx) - (i * 12 * baseSizePx)) + 'px)'"
                    >
                        @if (!card.facedown) {
                            {{ Suit[card.suit] + ' ' + Rank[card.rank] }}
                        }
                    </div>
                }
            </div>
        }
    </div>
    <div id="foundation-col" class="col-auto h-100">
        @for (foundation of foundations; track foundation) {
            <div class="foundation">
            </div>
        }
    </div>
</main>
