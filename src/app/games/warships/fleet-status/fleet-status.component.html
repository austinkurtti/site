<div class="fleet-status">
    @for (ship of fleet(); track ship) {
        <div class="ship row my-2 g-0 justify-content-between"
            [ngClass]="{
                'destroyed': ship.health === 0
            }"
        >
            <div class="col-6 d-flex flex-column justify-content-end">
                <div>{{ ship.name }}</div>
                <div>{{ ship.length }} units</div>
            </div>
            <div class="col-6 ship-img-container">
                <img class="invertible" [src]="'assets/images/warships/' + ship.id + '.png'" />
            </div>
            @if (isPlayer()) {
                <div class="col-12 health-bar d-flex gap-1 mt-1">
                    @for (x of [].constructor(ship.length); track x; let i = $index) {
                        <div class="health-bar-piece" [attr.data-filled]="i < ship.health"></div>
                    }
                </div>
            }
            @if (ship.health === 0) {
                <svg class="destroyed-overlay" height="100%" width="100%">
                    <line class="diagonal-line" x1="0" y1="0" x2="100%" y2="100%"></line>
                    <line class="diagonal-line" x1="0" y1="100%" x2="100%" y2="0"></line>
                </svg>
            }
        </div>
    }
</div>
